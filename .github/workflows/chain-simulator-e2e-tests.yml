name: Chain simulator e2e tests workflow

on:
  push:
    branches: [NewArc]
  pull_request:
    branches: [NewArc]

jobs:
  test-chainsimulator-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.14.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Build and start chain simulator
        run: npm run start-chain-simulator

      - name: Show logs if chain simulator fails to start
        if: failure()
        run: docker logs es-container && docker logs chainsimulator

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be healthy..."
          docker ps
          docker logs chainsimulator
          sleep 20 # Wait for 20 seconds to ensure services are up

      - name: Print docker containers
        run: docker ps

      - name: Start API Docker containers
        run: |
          # config.e2e.mainnet.yaml uses an isolated Redis instance on 6380.
          # Keep the default Compose mapping (6379) unchanged for non-E2E use.
          REDIS_PORT=6380 docker compose up -d

      - name: Wait for API docker containers to start
        run: |
          for attempt in {1..30}; do
            if docker compose ps --status running --services | grep -qx redis; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - run: npm ci
      - run: npm run init

      - name: Start API
        run: |
          setsid npm run start:mainnet:e2e > /tmp/mx-api-service.log 2>&1 &
          echo $! > /tmp/mx-api-service.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/hello > /dev/null; then
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/mx-api-service.pid)" 2>/dev/null; then
              cat /tmp/mx-api-service.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/mx-api-service.log
          exit 1

      - name: Prepare Test Data
        run: npm run prepare:test-data

      - name: Run e2e tests
        run: npm run test:cs-e2e

      - name: Show API and Docker diagnostics on failure
        if: failure()
        run: |
          cat /tmp/mx-api-service.log || true
          docker compose ps
          docker compose logs --no-color

      - name: Stop API after tests
        if: always()
        run: |
          if [ -f /tmp/mx-api-service.pid ]; then
            kill -- -"$(cat /tmp/mx-api-service.pid)" || true
          fi

          # nest may outlive its npm wrapper. Port 3001 belongs exclusively to
          # this job, so close a remaining listener as a safe fallback.
          listener_pid=$(lsof -t -iTCP:3001 -sTCP:LISTEN || true)
          if [ -n "$listener_pid" ]; then
            kill "$listener_pid" || true
          fi
